<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>EPI BAL 2026 - Scanner Mobile</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/mobile/controle.css">
</head>

<body>

    <!-- HEADER -->
    <div class="app-header">
        <img src="../../assets/logo.png" alt="Logo EPI" style="height: 60px; margin-bottom: 10px;">
            <div class="app-logo">EPI<span>-BAL</span> 2026</div>
        <div style="display:flex; gap:10px;">
            <a href="../desktop/dashboard.html" class="app-back"><i class="fa-solid fa-desktop"></i> PC</a>
            <button onclick="seDeconnecter()" class="app-back" style="color:#f87171; border-color:rgba(248,113,113,0.3);"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>

    <!-- === ÉCRAN 1 : MENU === -->
    <div id="screen-menu">
        <div class="screen-title">Scanner Mobile</div>
        <div class="screen-subtitle">Sélectionnez l'opération à effectuer</div>

        <button id="btnModeVente" class="mode-card vente" onclick="lancerScanner('vente')">
            <div class="mode-icon"><i class="fa-solid fa-ticket"></i></div>
            <div class="mode-info">
                <h3>Mode Guichet / Vente</h3>
                <p>Scanner un ticket vierge pour enregistrer son paiement.</p>
            </div>
        </button>

        <button class="mode-card porte" onclick="lancerScanner('porte')">
            <div class="mode-icon"><i class="fa-solid fa-door-open"></i></div>
            <div class="mode-info">
                <h3>Mode Contrôle / Porte</h3>
                <p>Scanner un ticket payé pour valider l'entrée dans la salle le Jour J.</p>
            </div>
        </button>
    </div>

    <!-- === ÉCRAN 2 : SCANNER === -->
    <div id="screen-scanner">
        <div class="scanner-header">
            <button class="btn-back-scan" onclick="retourMenu()">← Retour</button>
            <div class="mode-label" id="modeLabelTitle">Mode</div>
        </div>

        <!-- Lecteur caméra -->
        <div id="reader"></div>

        <!-- Popup Modal -->
        <div id="scanModal" class="modal-backdrop">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-detail" id="modalDetail"></div>
                <button class="btn-continue" onclick="fermerModal()">Continuer le scan <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Compteur session -->
        <div class="session-counter">
            <div class="counter-item">
                <span class="counter-val ok" id="cntOk">0</span>
                <span class="counter-lbl">Acceptés</span>
            </div>
            <div class="counter-item">
                <span class="counter-val ko" id="cntKo">0</span>
                <span class="counter-lbl">Refusés</span>
            </div>
            <div class="counter-item">
                <span class="counter-val" id="cntTotal" style="color:#e4e4e7;">0</span>
                <span class="counter-lbl">Total</span>
            </div>
        </div>
    </div>

    <script src="../../js/mobile/controle.js"></script>
</body>

</html>
