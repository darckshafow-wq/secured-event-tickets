<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>EPI BAL 2026 - Connexion</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <link rel="stylesheet" href="../../css/mobile/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-box">
        <div class="brand-header">
            <img src="../../assets/logo.png" alt="Logo EPI" style="height: 60px; margin-bottom: 10px;">
            <div class="app-logo">EPI<span>-BAL</span> 2026</div>
            <div class="subtitle">Accès Agents de Contrôle</div>
        </div>

        <div id="errorBox" class="error-msg"></div>

        <form id="loginForm" onsubmit="soumettreLogin(event)">
            <div class="input-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" required placeholder="Ex: agent" autocomplete="username">
            </div>
            <div class="input-group">
                <label>Code PIN (Mot de passe)</label>
                <input type="password" id="password" required placeholder="••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnSubmit">Se Connecter</button>
        </form>

        <a href="register.html" style="display:block; text-align:center; margin-top:18px; color:#94a3b8; font-size:13px; text-decoration:none;">
            Nouveau collaborateur ? <span style="color:#34d399; font-weight:700;">Créer un compte →</span>
        </a>
    </div>

    <script src="../../js/mobile/login.js"></script>
</body>
</html>
